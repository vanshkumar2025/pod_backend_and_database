services:
  postgres:
    image: postgres:16
    container_name: collabspace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: collabspace
      POSTGRES_USER: collabspace
      POSTGRES_PASSWORD: collabspace
    ports:
      - "5432:5432"
    volumes:
      - collabspace_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collabspace -d collabspace"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  collabspace_pg:
